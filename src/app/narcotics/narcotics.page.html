<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <img src="assets/images/condor-logo.svg" alt="Condor" class="header-logo">
    </ion-buttons>
    <ion-title>Narcotics</ion-title>
    <ion-buttons slot="end">
      <span class="powered-by">Powered by Condor</span>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="container">
    <form [formGroup]="narcoticsForm">

      <div formArrayName="entries" class="narcotics-list">
        <div *ngFor="let entry of entries.controls; let i = index" [formGroupName]="i" class="narcotic-card section-block">

          <div class="narcotic-card-header section-title-row">
            <div class="form-title-group">
              <div class="section-title">Narcotic Custody Record</div>
              <div class="form-subtitle">
                For use ONLY if PAX presents to flight line without narcotic custody record from facility
              </div>
            </div>
            <button *ngIf="entries.length > 1" tuiButton appearance="secondary" size="s" type="button" (click)="removeEntry(i)">
              Remove Record
            </button>
          </div>

          <div class="custody-grid">
            <div *ngFor="let row of topFieldRows" class="grid-row" [class.double-height]="row.rowClass === 'double-height'">
              <div class="grid-label">
                <ng-container *ngFor="let labelLine of row.labelLines; let last = last">
                  {{ labelLine }}<br *ngIf="!last">
                </ng-container>
              </div>
              <div class="grid-input" [class.field-alert]="isNarcoticAlertRow(row)">
                <formly-form
                  class="full-width"
                  [form]="asFormGroup(entry)"
                  [fields]="row.fields"
                  [model]="asFormGroup(entry).value">
                </formly-form>
              </div>
            </div>

            <div class="grid-row signature-row">
              <div class="grid-label">Received from - Signature :</div>
              <div class="grid-input signature-input">
                <div class="signature-canvas-wrap" [class.has-signature]="getControlValue(i, 'receivedFromSignature')">
                  <canvas #signatureCanvas 
                          class="signature-canvas" 
                          [attr.data-pad-id]="'recv-sig-' + i" 
                          [attr.data-index]="i" 
                          data-control-name="receivedFromSignature"></canvas>
                  <button tuiButton appearance="flat" size="s" class="clear-sig-btn" type="button" (click)="clearSignature('recv-sig-' + i, i, 'receivedFromSignature')">
                    Clear
                  </button>
                  <div class="signature-hint" *ngIf="!getControlValue(i, 'receivedFromSignature')">Sign here</div>
                </div>
              </div>
            </div>

            <div *ngFor="let row of bottomFieldRows" class="grid-row" [class.double-height]="row.rowClass === 'double-height'">
              <div class="grid-label">
                <ng-container *ngFor="let labelLine of row.labelLines; let last = last">
                  {{ labelLine }}<br *ngIf="!last">
                </ng-container>
              </div>
              <div class="grid-input">
                <formly-form
                  class="full-width"
                  [form]="asFormGroup(entry)"
                  [fields]="row.fields"
                  [model]="asFormGroup(entry).value">
                </formly-form>
              </div>
            </div>

            <div class="grid-row signature-row">
              <div class="grid-label">Released to - Signature :</div>
              <div class="grid-input signature-input">
                <div class="signature-canvas-wrap" [class.has-signature]="getControlValue(i, 'releasedToSignature')">
                  <canvas #signatureCanvas 
                          class="signature-canvas" 
                          [attr.data-pad-id]="'rel-sig-' + i" 
                          [attr.data-index]="i" 
                          data-control-name="releasedToSignature"></canvas>
                  <button tuiButton appearance="flat" size="s" class="clear-sig-btn" type="button" (click)="clearSignature('rel-sig-' + i, i, 'releasedToSignature')">
                    Clear
                  </button>
                  <div class="signature-hint" *ngIf="!getControlValue(i, 'releasedToSignature')">Sign here</div>
                </div>
              </div>
            </div>

            <div class="grid-row signature-row">
              <div class="grid-label">Flight Nurse Signature :</div>
              <div class="grid-input signature-input">
                <div class="signature-canvas-wrap" [class.has-signature]="getControlValue(i, 'flightNurseSignature')">
                  <canvas #signatureCanvas 
                          class="signature-canvas" 
                          [attr.data-pad-id]="'fn-sig-' + i" 
                          [attr.data-index]="i" 
                          data-control-name="flightNurseSignature"></canvas>
                  <button tuiButton appearance="flat" size="s" class="clear-sig-btn" type="button" (click)="clearSignature('fn-sig-' + i, i, 'flightNurseSignature')">
                    Clear
                  </button>
                  <div class="signature-hint" *ngIf="!getControlValue(i, 'flightNurseSignature')">Sign here</div>
                </div>
              </div>
            </div>
            
          </div>
        </div>
      </div>

      <div class="narcotics-actions ion-margin-top">
        <button tuiButton size="m" appearance="secondary" type="button" (click)="addEntry()">
          Add Another Record
        </button>
      </div>

      <div class="ion-margin-top">
        <button tuiButton appearance="primary" size="l" class="full-width" type="button" (click)="saveNarcotics()">
          Save Record(s)
        </button>
      </div>
    </form>
  </div>
</ion-content>
