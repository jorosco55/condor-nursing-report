<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Meds</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="container">
    <form [formGroup]="medsForm">
      <h2 class="ion-text-center">Meds</h2>

      <div class="section-block">
        <div class="section-title">Medication</div>
        <div formArrayName="paxMedicated">
          <ng-container *ngFor="let paxEntry of paxMedicated.controls; let i = index">
            <ion-row [formGroupName]="i" class="meds-row">
              <ion-col size="12">
                <div class="med-card">
                <div class="card-title">Med Info</div>
                  <ion-row>
                    <ion-col size="12" size-sm="6" size-md="3">
                      <tui-textfield class="full-width">
                        <input tuiTextfield formControlName="aNumber">
                        <label>A-Number</label>
                      </tui-textfield>
                    </ion-col>
                    <ion-col size="12" size-sm="6" size-md="9">
                      <tui-textfield class="full-width select-field" [class.field-alert]="medsRequired && !hasAnyMedsSelection()">
                        <select tuiSelect formControlName="medication" [items]="medicationOptions" placeholder="-- Select --"></select>
                        <label>Medication</label>
                      </tui-textfield>
                    </ion-col>
                  </ion-row>
                  <ion-row>
                    <ion-col size="12" size-sm="6" size-md="4">
                      <tui-textfield class="full-width select-field">
                        <select tuiSelect formControlName="dose" [items]="doseOptions" placeholder="-- Select --"></select>
                        <label>Dose</label>
                      </tui-textfield>
                    </ion-col>
                    <ion-col size="12" size-sm="6" size-md="4">
                      <tui-textfield class="full-width select-field">
                        <select tuiSelect formControlName="doseUnit" [items]="doseUnits" placeholder="-- Select --"></select>
                        <label>Dose Units</label>
                      </tui-textfield>
                    </ion-col>
                    <ion-col size="12" size-sm="6" size-md="4">
                      <tui-textfield class="full-width select-field">
                        <select tuiSelect formControlName="route" [items]="routeOptions" placeholder="-- Select --"></select>
                        <label>Route</label>
                      </tui-textfield>
                    </ion-col>
                  </ion-row>

                  <ion-row>
                    <ion-col size="12" size-sm="8" size-md="9">
                      <tui-textfield class="full-width">
                        <input tuiTextfield formControlName="annotatedOnMtf">
                        <label>Annotated on MTF</label>
                      </tui-textfield>
                    </ion-col>
                    <ion-col size="12" size-sm="2" size-md="2" class="ion-align-self-center">
                      <label class="checkbox-inline">
                        <input tuiCheckbox type="checkbox" formControlName="prnGiven">
                        <span>PRN</span>
                      </label>
                    </ion-col>
                    <ion-col size="12" size-sm="2" size-md="1" class="ion-align-self-center">
                      <button tuiButton appearance="secondary" size="s" (click)="removePaxMedicated(i)" type="button">
                        Remove
                      </button>
                    </ion-col>
                  </ion-row>

                  <ion-row>
                    <ion-col size="12">
                      <div class="vitals-section">
                        <div class="vitals-title">
                          <span>Vitals</span>
                          <label class="checkbox-inline">
                            <input tuiCheckbox type="checkbox" formControlName="vitalsNa">
                            <span>N/A</span>
                          </label>
                        </div>
                        <div class="vitals-hint" *ngIf="paxEntry.get('vitalsNa')?.value">
                          Vitals hidden (N/A)
                        </div>
                        <div class="vitals-grid" *ngIf="!paxEntry.get('vitalsNa')?.value">
                        <div class="vitals-item">
                          <ion-icon name="swap-vertical-outline"></ion-icon>
                            <label>BP (mmHg)</label>
                            <div class="bp-inputs">
                              <div class="bp-combined-field">
                              <div class="bp-input">
                                <input type="text" inputmode="numeric" placeholder="Sys" aria-label="Systolic" formControlName="bpSystolic">
                                <span class="bp-label">Sys</span>
                              </div>
                              <span class="bp-divider">/</span>
                              <div class="bp-input">
                                <input type="text" inputmode="numeric" placeholder="Dia" aria-label="Diastolic" formControlName="bpDiastolic">
                                <span class="bp-label">Dia</span>
                              </div>
                              </div>
                            </div>
                        </div>

                          <div class="vitals-item">
                            <ion-icon name="heart-outline"></ion-icon>
                            <label>HR</label>
                            <div class="vitals-unit-field">
                              <tui-textfield>
                                <input tuiTextfield formControlName="hr">
                              </tui-textfield>
                              <span class="vitals-unit">bpm</span>
                            </div>
                          </div>

                          <div class="vitals-item">
                            <ion-icon name="pulse-outline"></ion-icon>
                            <label>Resp</label>
                            <div class="vitals-unit-field">
                              <tui-textfield>
                                <input tuiTextfield formControlName="resp">
                              </tui-textfield>
                              <span class="vitals-unit">rpm</span>
                            </div>
                          </div>

                          <div class="vitals-item">
                            <ion-icon name="thermometer-outline"></ion-icon>
                            <label>Temp</label>
                            <div class="vitals-unit-field">
                              <tui-textfield>
                                <input tuiTextfield formControlName="temp">
                              </tui-textfield>
                              <span class="vitals-unit">F</span>
                            </div>
                          </div>

                          <div class="vitals-item">
                            <ion-icon name="water-outline"></ion-icon>
                            <label>O2 Sat</label>
                            <div class="vitals-unit-field">
                              <tui-textfield>
                                <input tuiTextfield formControlName="o2Sat">
                              </tui-textfield>
                              <span class="vitals-unit">%</span>
                            </div>
                          </div>

                          <div class="vitals-item">
                            <ion-icon name="speedometer-outline"></ion-icon>
                            <label>Rate%</label>
                            <div class="vitals-unit-field">
                              <tui-textfield>
                                <input tuiTextfield formControlName="ratePercent">
                              </tui-textfield>
                              <span class="vitals-unit">%</span>
                            </div>
                          </div>

                        </div>
                      </div>
                    </ion-col>
                  </ion-row>
                </div>
              </ion-col>
            </ion-row>
            <hr class="card-divider" *ngIf="i < paxMedicated.length - 1">
          </ng-container>
        </div>
        <button tuiButton appearance="primary" size="m" type="button" (click)="addPaxMedicated()">
          Add PAX
        </button>
      </div>

      <div class="ion-margin-top ion-padding">
        <button tuiButton appearance="primary" size="l" class="full-width" type="button" (click)="saveMeds()">
          Save Medication
        </button>
      </div>
    </form>
  </div>
</ion-content>
