<ion-content class="login-content">
  <div class="login-container">
    <!-- Condor Logo -->
    <div class="logo-section">
      <img src="assets/images/condor-logo.svg" alt="Condor Logo" class="condor-logo">
      <p class="tagline">Powered by Condor</p>
    </div>

    <!-- Company Name -->
    <div class="company-section">
      <h1 class="company-name">VIGHTER</h1>
      <p class="company-subtitle">Flight Nursing Report System</p>
    </div>

    <!-- Login Form -->
    <div class="login-form">
      <tui-textfield class="full-width">
        <input
          tuiTextfield
          [(ngModel)]="username"
          placeholder="Enter your username"
          autocomplete="username">
        <label>Username</label>
      </tui-textfield>

      <tui-textfield class="full-width">
        <input
          tuiInputPassword
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          (keyup.enter)="onLogin()">
        <label>Password</label>
      </tui-textfield>

      <button tuiButton appearance="primary" size="l" class="login-button" type="button" (click)="onLogin()">
        Sign In
      </button>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <p>&copy; 2026 Vighter LLC. All rights reserved.</p>
    </div>
  </div>
</ion-content>
